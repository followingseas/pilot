name: publish
# GitHub Release를 publish하면 npm에 배포한다. NPM_TOKEN 시크릿 필요.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance(OIDC)에 필요

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
