name: publish
# GitHub Release를 publish하면 npm에 배포한다.
# 인증은 npm Trusted Publishing(OIDC) — 장기 토큰(NPM_TOKEN) 없이 단기 토큰으로 배포하며
# provenance도 자동 생성된다. npm 쪽 패키지 설정에 이 저장소·워크플로가 등록돼 있어야 한다.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # OIDC 토큰 발급에 필요

jobs:
  publish:
    runs-on: ubuntu-latest # Trusted Publishing은 GitHub-hosted 러너만 지원
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # OIDC 요구: node 22.14+ / npm 11.5.1+
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish
